meters:
- name: paid_ticket_fee
  description: Per-ticket fee on paid tickets (3% standard, 2.5% charity/non-profit), capped at 25 EUR per ticket.
  unit: tickets
  aggregation: sum
  dimensions:
  - account
  - event
  - release
- name: refunded_tickets
  description: Tickets refunded; relevant to reconciling net Tito fees against gross ticket sales.
  unit: tickets
  aggregation: sum
  dimensions:
  - account
  - event
- name: payment_processing_fee
