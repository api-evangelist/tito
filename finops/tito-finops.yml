  - event
  - processor
principles:
- name: Visibility
  description: Track per-ticket Tito fees per event and release, and separately track payment-processor fees so total cost of ticketing is visible.
- name: Allocation
  description: Map ticket fees to the specific event, account, and release so cost is allocated to the program or business unit running the event.
- name: Optimization
  description: For high-priced tickets, model the 25 EUR per-ticket cap; apply for the charity/non-profit rate if eligible; run genuinely free events at no Tito cost.
- name: Accountability
  description: Assign an owner per event to reconcile Tito fees plus processor fees against gross ticket revenue each cycle.
