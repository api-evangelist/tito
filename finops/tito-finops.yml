description: >-
  FinOps view of Tito spend. Tito's cost model is a per-ticket fee on paid
  events rather than a subscription: 3% per ticket on the standard rate (2.5%
  for approved charity, non-profit, and community organizations), with the
  per-ticket fee capped at 25 EUR per ticket. Free events incur no Tito fee, and
  there is no setup fee, monthly subscription, or premium-feature surcharge.
  Payment-processing fees (for example Stripe at roughly 2.9% + 30 cents in the
  US or 1.4% + 0.25 EUR in Europe) are charged separately by the payment
  gateway, not by Tito, and should be tracked as a distinct line item. The Admin
  API adds no incremental cost - spend scales with paid tickets sold, so cost is
  effectively a variable, revenue-linked cost of sales.
notes: >-
  Per-unit rates reflect Tito's public pricing page at the review date and are
  not reconciled against an invoice. Verify the per-ticket percentage, the
  charity rate, and the 25 EUR cap on https://ti.to/pricing, and confirm your
  payment processor's rates separately.
