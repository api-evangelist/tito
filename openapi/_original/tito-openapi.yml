    patch:
      operationId: updateRelease
      tags:
        - Releases
      summary: Update a release
      requestBody:
        $ref: '#/components/requestBodies/GenericBody'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteRelease
      tags:
        - Releases
      summary: Delete a release
      responses:
        '204':
          description: Release deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /{account_slug}/{event_slug}/releases/{release_slug}/archival:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
      - $ref: '#/components/parameters/ReleaseSlug'
    post:
      operationId: archiveRelease
      tags:
        - Releases
      summary: Archive a release
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      operationId: unarchiveRelease
      tags:
        - Releases
      summary: Unarchive a release
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{account_slug}/{event_slug}/releases/{release_slug}/duplication:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
