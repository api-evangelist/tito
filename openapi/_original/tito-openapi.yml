webhooks:
  ticketEvent:
    post:
      operationId: ticketWebhook
      summary: Ticket lifecycle webhook
      description: >-
        Tito POSTs a JSON payload to your registered webhook endpoint when a
        ticket event occurs. Triggers include ticket.created, ticket.completed,
        ticket.reassigned, ticket.updated, ticket.unsnoozed, ticket.unvoided,
        and ticket.voided. This is outbound HTTP delivery, not a WebSocket.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Generic'
      responses:
        '200':
          description: Acknowledged by your endpoint.
  registrationEvent:
    post:
      operationId: registrationWebhook
      summary: Registration lifecycle webhook
      description: >-
        Tito POSTs a JSON payload when a registration event occurs. Triggers
        include registration.updated, registration.finished,
        registration.completed, and registration.cancelled.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Generic'
      responses:
        '200':
          description: Acknowledged by your endpoint.
  checkinEvent:
    post:
      operationId: checkinWebhook
      summary: Check-in webhook
      description: Tito POSTs a payload when an attendee is checked in (checkin.created).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Generic'
      responses:
        '200':
          description: Acknowledged by your endpoint.
  interestedUserEvent:
    post:
      operationId: interestedUserWebhook
      summary: Interested-user webhook
      description: >-
        Tito POSTs a payload on interested_user.created,
        interested_user.updated, and interested_user.deleted.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Generic'
      responses:
        '200':
          description: Acknowledged by your endpoint.
components:
  securitySchemes:
    titoToken:
      type: apiKey
      in: header
      name: Authorization
      description: >-
        Secret API token generated at https://id.tito.io/api-access-tokens,
        sent as `Authorization: Token token=YOUR-API-TOKEN`. Requests must also
        send `Accept: application/json`. Tokens carry a live or test mode.
  parameters:
    AccountSlug:
      name: account_slug
      in: path
      required: true
      description: The slug attribute of an Account.
      schema:
        type: string
    EventSlug:
      name: event_slug
      in: path
      required: true
      description: The slug attribute of an Event.
      schema:
        type: string
    ReleaseSlug:
      name: release_slug
      in: path
      required: true
      description: The slug attribute of a Release.
      schema:
        type: string
    TicketSlug:
      name: ticket_slug
      in: path
      required: true
      description: The slug attribute of a Ticket.
      schema:
        type: string
    RegistrationSlug:
      name: registration_slug
      in: path
      required: true
      description: The slug attribute of a Registration.
      schema:
        type: string
    DiscountCodeId:
      name: discount_code_id
      in: path
      required: true
      description: The id of a Discount Code.
      schema:
        type: string
    ActivityId:
      name: activity_id
      in: path
      required: true
      description: The id of an Activity.
      schema:
        type: string
    CheckinListSlug:
      name: checkin_list_slug
      in: path
      required: true
      description: The slug of a Check-in List.
      schema:
        type: string
    RefundId:
      name: refund_id
      in: path
      required: true
      description: The id of a Refund.
      schema:
        type: string
    WebhookEndpointId:
      name: id
      in: path
      required: true
      description: The id of a Webhook Endpoint.
      schema:
        type: string
  requestBodies:
    GenericBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Generic'
    EventBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              event:
                type: object
                description: Event attributes (modeled; see documented attribute table).
                additionalProperties: true
    WebhookEndpointBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              webhook_endpoint:
                type: object
                description: >-
                  Webhook endpoint attributes (modeled). Typically includes a
                  target url and the set of triggers to subscribe to.
                properties:
                  url:
                    type: string
                    format: uri
                  included_triggers:
                    type: array
                    items:
                      type: string
                additionalProperties: true
  responses:
    Resource:
      description: A single resource. Body schema is modeled and loosely typed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Generic'
    Collection:
      description: >-
        A paginated collection. Pagination metadata is returned in a meta object
        (current_page, next_page, prev_page, total_pages, total_count, per_page,
        overall_total). Use page[number] and page[size] query parameters
        (default page size 100, maximum 1000).
      content:
        application/json:
          schema:
            type: object
            properties:
              meta:
                $ref: '#/components/schemas/PaginationMeta'
            additionalProperties: true
    Unauthorized:
      description: Missing or invalid API token.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The requested resource was not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: The request payload failed validation.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Generic:
      type: object
      description: >-
        Loosely-typed object modeled from Tito's documented attribute tables and
        example payloads. Field-level structure is not exhaustively specified.
      additionalProperties: true
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        next_page:
          type: integer
          nullable: true
        prev_page:
          type: integer
          nullable: true
        total_pages:
          type: integer
        total_count:
          type: integer
        per_page:
          type: integer
        overall_total:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string
        errors:
          type: array
          items:
            type: string
      additionalProperties: true
