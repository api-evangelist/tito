openapi: 3.0.3
info:
  title: Tito Admin API
  description: >-
    The Tito Admin API is a REST/JSON interface for secure programmatic access to
    Tito, an event registration and ticketing platform. It is used to manage
    accounts, events, releases (ticket types), tickets, registrations, discount
    codes, activities, check-in lists, refunds, and webhook endpoints. Resources
    are addressed by their account_slug and event_slug.

    Authentication uses a secret API token generated at https://id.tito.io
    (api-access-tokens), passed in the Authorization header as
    `Token token=YOUR-API-TOKEN`, together with an `Accept: application/json`
    header. Tokens carry a live or test mode.

    NOTE ON FIDELITY: All paths, HTTP methods, path parameters, query filters,
    and the authentication scheme in this document are grounded in Tito's
    official Admin API v3.0 documentation (https://ti.to/docs/api/admin/3.0).
    Tito does not publish a machine-readable OpenAPI/JSON Schema definition, so
    the request and response BODY schemas here are modeled from the documented
    attribute tables and example payloads and are intentionally loosely typed
    (additionalProperties: true). Treat field-level schemas as a reasonable
    model, not an exhaustive contract.
  version: '3.0'
  contact:
    name: Tito (Team Tito)
    url: https://ti.to
  license:
    name: Proprietary
    url: https://ti.to/terms
servers:
  - url: https://api.tito.io/v3
    description: Tito Admin API (production)
security:
  - titoToken: []
tags:
  - name: Account
    description: Authentication check and account discovery.
  - name: Events
    description: Events that tickets are sold for.
  - name: Releases
    description: Ticket types (releases) for an event.
  - name: Tickets
    description: Individual tickets held by attendees.
  - name: Registrations
    description: Orders that group one or more tickets.
  - name: Discount Codes
    description: Percentage or fixed discounts applied at checkout.
  - name: Activities
    description: Capacity-bound sessions releases can attach to.
  - name: Check-in Lists
    description: Lists defining which tickets can be checked in.
  - name: Refunds
    description: Refund records against registrations.
  - name: Webhook Endpoints
    description: Endpoints Tito POSTs event notifications to.
paths:
  /hello:
    get:
      operationId: hello
      tags:
        - Account
      summary: Confirm authentication
      description: Confirms the API token is valid and lists the accounts it can access.
      responses:
        '200':
          description: Authentication confirmation.
          content:
            application/json:
              schema:
                type: object
                properties:
                  authenticated:
                    type: boolean
                  access_token:
                    type: string
                    description: The last four characters of the token used.
                  lookup_mode:
                    type: string
                    enum: [live, test]
                  accounts:
                    type: array
                    items:
                      type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{account_slug}/events:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
    get:
      operationId: listEvents
      tags:
        - Events
      summary: Get all upcoming events
      description: Retrieves all upcoming events for the given account.
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createEvent
      tags:
        - Events
      summary: Create an event
      description: Creates a new event belonging to the given account.
      requestBody:
        $ref: '#/components/requestBodies/EventBody'
      responses:
        '201':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /{account_slug}/events/past:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
    get:
      operationId: listPastEvents
      tags:
        - Events
      summary: Get all past events
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{account_slug}/events/archived:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
    get:
      operationId: listArchivedEvents
      tags:
        - Events
      summary: Get all archived events
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{account_slug}/{event_slug}:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
    get:
      operationId: getEvent
      tags:
        - Events
      summary: Get an event
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateEvent
      tags:
        - Events
      summary: Update an event
      requestBody:
        $ref: '#/components/requestBodies/EventBody'
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteEvent
      tags:
        - Events
      summary: Delete an event
      responses:
        '204':
          description: Event deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /{account_slug}/{event_slug}/duplication:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
    post:
      operationId: duplicateEvent
      tags:
        - Events
      summary: Duplicate an event
      description: Asynchronously duplicates an event. Poll with GET to check status.
      responses:
        '202':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: getEventDuplicationStatus
      tags:
        - Events
      summary: Get event duplication status
      description: Returns the latest status (processing or complete) of an event duplication.
      responses:
        '200':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /{account_slug}/{event_slug}/releases:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
    get:
      operationId: listReleases
      tags:
        - Releases
      summary: Get all releases
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createRelease
      tags:
        - Releases
      summary: Create a release
      requestBody:
        $ref: '#/components/requestBodies/GenericBody'
      responses:
        '201':
          $ref: '#/components/responses/Resource'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
