  /{account_slug}/{event_slug}/tickets:
    parameters:
      - $ref: '#/components/parameters/AccountSlug'
      - $ref: '#/components/parameters/EventSlug'
    get:
      operationId: listTickets
      tags:
        - Tickets
      summary: Get all tickets
      description: >-
        Lists tickets for an event. Supports filtering via search parameters -
        e.g. search[states][], search[types][], search[release_ids][],
        search[activity_ids][], search[created_at][gt], search[updated_at][gt],
        search[sort], search[direction] - and free-text search via q.
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search across ticket holders.
          schema:
            type: string
      responses:
        '200':
          $ref: '#/components/responses/Collection'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createTicket
      tags:
