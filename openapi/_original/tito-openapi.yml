      summary: Get all registrations
      description: >-
        Lists registrations for an event. Supports search filters such as
        search[states][], search[created_at][gt], search[updated_at][gt],
        search[sort], search[direction], and free-text q.
      parameters:
        - name: q
          in: query
          required: false
          description: Free-text search across registrations.
