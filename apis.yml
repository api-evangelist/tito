aid: tito
url: https://raw.githubusercontent.com/api-evangelist/tito/refs/heads/main/apis.yml
name: Tito
kind: company
description: Tito (ti.to) is an event registration and ticketing platform from Team
  Tito in Dublin, Ireland, used to sell tickets, collect registrations, and check in
  attendees for conferences and events. Organizers can sell through Tito-hosted event
  pages or an embeddable widget. The Admin API is a REST/JSON interface at
  https://api.tito.io/v3 for managing accounts, events, releases (ticket types),
  tickets, registrations, discount codes, activities, check-in lists, and refunds,
  authenticated with a secret API token. Tito also emits outbound webhooks for ticket,
  registration, check-in, and interested-user events, and exposes a separate
  unauthenticated Check-in API.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Event Ticketing
- Events
- Registration
- Ticketing
- Conferences
- Event Management
- Attendees
- Webhooks
- SaaS
created: '2026-07-12'
modified: '2026-07-12'
