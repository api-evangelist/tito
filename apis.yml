  - url: openapi/tito-openapi.yml
    type: OpenAPI
  - url: collections/tito.postman_collection.json
    type: PostmanCollection
  - url: collections/tito.opencollection.json
    type: OpenCollection
  description: Register, list, retrieve, update, and delete Webhook Endpoints that
    Tito POSTs event notifications to. Triggers include ticket.created,
    ticket.completed, ticket.reassigned, ticket.voided, registration.finished,
    registration.completed, registration.cancelled, checkin.created, and
    interested_user events. Delivery is outbound HTTP, not a subscription socket.
