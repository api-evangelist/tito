aid: tito
name: Tito
review:
  question: Does Tito expose a documented public WebSocket API?
  answer: false
  date: '2026-07-12'
  reviewer: API Evangelist
  asyncapiSpecCreated: false
  asyncapiScopeNote: |
    No AsyncAPI document was authored. Tito's public API surface is
    request/response REST over HTTPS (the Admin API at
    https://api.tito.io/v3 and the unauthenticated Check-in API at
    https://checkin.tito.io). Tito's event-driven surface is delivered as
    outbound webhooks - Tito POSTs a JSON payload to endpoints you register -
    which is server-to-endpoint HTTP, not a WebSocket, SSE, or other
    subscription transport hosted on Tito's own API. There is no server-push
    channel on Tito's own API to model, so no AsyncAPI document was created.
findings:
  summary: |
    Tito does not publish a documented public WebSocket API. Tito is an event
    registration and ticketing platform. Its Admin API is a REST/JSON API with
    base URL https://api.tito.io/v3, authenticated by a secret API token passed
    as `Authorization: Token token=YOUR-API-TOKEN` together with an
    `Accept: application/json` header. Resources (events, releases, tickets,
    registrations, discount codes, activities, check-in lists, refunds, webhook
    endpoints) are addressed by account_slug and event_slug and all use standard
    REST verbs. Tito's real-time delivery is via outbound webhooks (HTTP POST to
    a registered endpoint) for triggers such as ticket.created, ticket.completed,
    registration.finished, registration.completed, registration.cancelled,
    checkin.created, and interested_user.*. A separate Check-in API
    (https://checkin.tito.io) is unauthenticated and takes a Check-in List slug
    in the URL. No realtime, bidirectional, or streaming WebSocket (ws:// or
    wss://) endpoint is documented anywhere in Tito's Admin API, Check-in API,
    Checkout API, or widget documentation as of the review date.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api.tito.io/v3
      documented: true
      note: Admin API. REST/JSON, secret API token via Authorization Token header.
    - protocol: REST
      scheme: https
      baseURL: https://checkin.tito.io
      documented: true
      note: Check-in API. Unauthenticated; each request includes the Check-in List slug in the URL.
    - protocol: Webhook
      scheme: https
      documented: true
      note: Tito POSTs JSON payloads to endpoints registered via the Webhook Endpoints API. Server-to-endpoint HTTP, not WebSocket.
    - protocol: WebSocket
      scheme: wss
      documented: false
      note: No WebSocket endpoint is documented in Tito's Admin API, Check-in API, Checkout API, widget, or changelog as of the review date.
