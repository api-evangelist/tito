actions:
  asyncapiPath: null
  apisYmlUpdated: true
  reason: |
    No WebSocket protocol surface exists. Tito's own public API is
    request/response REST (Admin API and Check-in API) plus outbound webhooks.
    No AsyncAPI document was created because there is no server-push transport
    (WebSocket or SSE) hosted on Tito's own API to model; webhook delivery is
    Tito POSTing to an endpoint you host and is documented in the OpenAPI and
    apis.yml as a webhook integration rather than a subscription API.
