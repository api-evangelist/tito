  endpointsModeled:
    - note: |
        All paths, HTTP methods, and authentication above are confirmed from
        Tito's official Admin API v3.0 documentation. What is MODELED (not
        copied verbatim from a machine-readable Tito spec, because Tito does not
        publish OpenAPI) is the request/response JSON body SCHEMAS in
        openapi/tito-openapi.yml - attribute names for events, releases,
        tickets, registrations, discount codes, activities, check-in lists,
        refunds, and webhook endpoints are drawn from the documented attribute
        tables and example payloads but are represented as a lightweight,
        loosely-typed schema. Treat field-level schemas as a reasonable model,
        not an exhaustive contract.
